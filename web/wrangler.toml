name = "gamerater"
main = "src/index.js"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# Static assets (web/public) are served by the Worker's asset binding. Requests
# that match a file are served directly; only /api/* (and unmatched paths) run
# the Worker in src/index.js.
[assets]
directory = "./public"
binding = "ASSETS"

# Runtime configuration is set as Worker variables / secrets in the Cloudflare
# dashboard (Settings → Variables and Secrets) or via `wrangler secret put`,
# NOT committed here:
#   FIREBASE_PROJECT_ID   your Firebase project id (e.g. vg-ranker)
#   GITHUB_REPO           "owner/name" of this GitHub repo
#   GITHUB_TOKEN          fine-grained token with Actions: read/write (secret)
#   GITHUB_REF            branch the scrape workflow lives on (optional, default "main")
#   WORKFLOW_FILE         workflow filename (optional, default "scrape.yml")
