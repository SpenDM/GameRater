name = "gamerater"
main = "src/index.js"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# Static assets (web/public) are served by the Worker's asset binding. Requests
# that match a file are served directly; only /api/* (and unmatched paths) run
# the Worker in src/index.js.
[assets]
directory = "./public"
binding = "ASSETS"

[vars]
FIREBASE_PROJECT_ID = "vg-ranker"
GITHUB_REPO         = "SpenDM/GameRater"
GITHUB_REF          = "master"
# GITHUB_TOKEN is a secret — set via: wrangler secret put GITHUB_TOKEN
# WORKFLOW_FILE defaults to "scrape.yml"
