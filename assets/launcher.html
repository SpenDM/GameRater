<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameRater</title>
  <link rel="icon" type="image/png" href="GameRaterLogo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:          #0f0f13;
      --surface:     #18181f;
      --surface2:    #1f1f2a;
      --border:      #2a2a38;
      --text:        #e8e8f0;
      --text-dim:    #7a7a99;
      --text-muted:  #4a4a66;
      --accent:      #a78bfa;
      --good:        #2563eb;
      --bad:         #c2620a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      scrollbar-color: var(--accent) transparent;
      scrollbar-width: thin;
    }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: #bfa0ff; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.6;
    }

    /* ── Two-pane shell ── */
    .app {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    .sidebar {
      flex: 1 1 0;
      min-width: 260px;
      height: 100vh;
      overflow: hidden;
      border-right: 1px solid var(--border);
      padding: 1rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    #rater-frame {
      flex: 3 1 0;
      height: 100vh;
      border: none;
      background: var(--bg);
    }

    /* ── View toggle (sidebar) ── */
    .view-toggle {
      display: flex;
      gap: 0.4rem;
    }

    .view-toggle .view-btn {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: 8px;
      padding: 0.55rem 0.4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      cursor: pointer;
      font-family: 'Syne', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      transition: all 0.15s ease;
    }

    .view-toggle .view-btn:hover { border-color: var(--accent); color: var(--text); }

    .view-toggle .view-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0f0f13;
    }

    /* ── Year list (sidebar, scrollable) ── */
    /* Compact grid so every year fits without scrolling. */
    .year-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
      gap: 0.3rem;
      overflow: hidden;
    }

    .year-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: 6px;
      padding: 0.3rem 0.2rem;
      text-align: center;
      cursor: pointer;
      font-family: 'Syne', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      transition: all 0.15s ease;
    }

    .bottom-actions {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .export-btn, .quit-btn { width: 100%; }

    .export-btn:hover { border-color: var(--accent); color: var(--accent); }

    .export-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .export-msg {
      font-size: 0.78rem;
      color: var(--text-dim);
      text-align: center;
      min-height: 1em;
      word-break: break-word;
    }

    .export-msg.error { color: var(--bad); }

    .quit-btn:hover { border-color: var(--bad); color: var(--bad); }

    .year-item:hover { border-color: var(--accent); color: var(--text); }

    .year-item.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0f0f13;
    }

    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.9rem 1rem;
      flex-shrink: 0;
    }

    section h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.6rem;
      color: var(--text);
    }

    #year-section { flex: 0 0 auto; }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    .field { margin-bottom: 1rem; }
    .field:last-of-type { margin-bottom: 0; }

    input[type="url"] {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
    }

    input[type="url"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.55rem 1.1rem;
      border-radius: 8px;
      font-family: 'Syne', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover { border-color: var(--accent); color: var(--accent); }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .row-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 1.25rem;
    }

    .save-msg {
      font-size: 0.82rem;
      color: var(--text-dim);
    }

    .add-games-row {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .add-games-row .btn { width: 100%; }

    #running-indicator {
      display: none;
      align-items: center;
      gap: 0.6rem;
      margin-top: 1.25rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
    }

    #running-indicator.visible { display: flex; }

    .spinner {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid color-mix(in srgb, var(--accent) 30%, transparent);
      border-top-color: var(--accent);
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #status-box {
      margin-top: 0.6rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      max-height: 80px;
      overflow-y: auto;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      color: var(--text-dim);
      white-space: pre-wrap;
      display: none;
    }

    #status-box.visible { display: block; }

    .banner {
      margin-top: 0.75rem;
      padding: 0.6rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      display: none;
    }

    .banner.visible { display: block; }

    .banner.success {
      background: color-mix(in srgb, var(--good) 15%, transparent);
      color: #93b6f8;
      border: 1px solid color-mix(in srgb, var(--good) 35%, transparent);
    }

    .banner.error {
      background: color-mix(in srgb, var(--bad) 15%, transparent);
      color: #f0b380;
      border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent);
    }

    .hint {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <section id="urls-section">
      <h2>Backloggd URLs</h2>
      <div class="field">
        <label for="folder-url">Games Played Folder URL</label>
        <input type="url" id="folder-url" placeholder="https://backloggd.com/u/<you>/lists/folder/games-played-by-year/" />
      </div>
      <div class="field">
        <label for="master-url">Full Game List URL</label>
        <input type="url" id="master-url" placeholder="https://backloggd.com/u/<you>/games/" />
      </div>
      <span class="save-msg" id="save-urls-msg"></span>
    </section>

    <section id="add-games-section">
      <h2>Add Games</h2>
      <div class="add-games-row">
        <button class="btn" id="btn-current-year" data-op="current_year" disabled>Current Year</button>
        <button class="btn" id="btn-all-lists" data-op="all_played_lists" disabled>All Year Lists</button>
        <button class="btn" id="btn-historic" data-op="historic" disabled>All Games Played</button>
      </div>
      <div id="running-indicator">
        <span class="spinner"></span>
        <span id="running-op-label"></span>
      </div>
      <div id="status-box"></div>
      <div class="banner" id="result-banner"></div>
    </section>

    <section id="view-section">
      <h2>View</h2>
      <div class="view-toggle" id="view-toggle">
        <button class="view-btn active" data-view="tier" title="Tier view">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="2" width="14" height="3.5" rx="1" fill="currentColor" opacity="0.9"/><rect x="1" y="6.5" width="14" height="3" rx="1" fill="currentColor" opacity="0.65"/><rect x="1" y="10.5" width="14" height="3" rx="1" fill="currentColor" opacity="0.4"/></svg>
          Tier
        </button>
        <button class="view-btn" data-view="list" title="List view">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="5" y="2" width="9" height="2" rx="1" fill="currentColor"/><rect x="5" y="7" width="9" height="2" rx="1" fill="currentColor"/><rect x="5" y="12" width="9" height="2" rx="1" fill="currentColor"/><rect x="2" y="2" width="2" height="2" rx="0.5" fill="currentColor"/><rect x="2" y="7" width="2" height="2" rx="0.5" fill="currentColor"/><rect x="2" y="12" width="2" height="2" rx="0.5" fill="currentColor"/></svg>
          List
        </button>
        <button class="view-btn" data-view="goty" title="GOTY view">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M5 1.5h6v3.5a3 3 0 0 1-6 0V1.5Z" fill="currentColor"/><path d="M5 2.2H2.7a1 1 0 0 0-1 1.1c.15 1.5 1 2.7 2.6 3.2" stroke="currentColor" stroke-width="1.1" fill="none" stroke-linecap="round"/><path d="M11 2.2h2.3a1 1 0 0 1 1 1.1c-.15 1.5-1 2.7-2.6 3.2" stroke="currentColor" stroke-width="1.1" fill="none" stroke-linecap="round"/><rect x="7" y="8.5" width="2" height="2.3" fill="currentColor"/><path d="M4.5 14.5c0-1.4 1.5-2.3 3.5-2.3s3.5 0.9 3.5 2.3v.3h-7v-.3Z" fill="currentColor"/></svg>
          GOTY
        </button>
      </div>
    </section>

    <section id="year-section">
      <h2>Year</h2>
      <div class="year-list" id="year-list"></div>
    </section>

    <div class="bottom-actions">
      <span class="export-msg" id="export-msg"></span>
      <button class="btn export-btn" id="export-btn">Export Image</button>
      <button class="btn quit-btn" id="quit-btn">Quit</button>
    </div>
  </aside>

  <iframe id="rater-frame" title="Rater" src="gamelog.html"></iframe>
</div>

<script>
const api = () => window.pywebview && window.pywebview.api;

const opButtons = {
  current_year:     document.getElementById('btn-current-year'),
  all_played_lists: document.getElementById('btn-all-lists'),
  historic:         document.getElementById('btn-historic'),
};
const startMethod = {
  current_year:     'start_current_year',
  all_played_lists: 'start_all_played_lists',
  historic:         'start_historic',
};
const opLabels = {
  current_year:     'Current Year',
  all_played_lists: 'All Year Lists',
  historic:         'All Games Played',
};

const statusBox        = document.getElementById('status-box');
const resultBanner     = document.getElementById('result-banner');
const runningIndicator = document.getElementById('running-indicator');
const runningOpLabel   = document.getElementById('running-op-label');
const raterFrame       = document.getElementById('rater-frame');

let pollHandle = null;

function setButtonsEnabled(enabled) {
  Object.values(opButtons).forEach(btn => btn.disabled = !enabled);
}

function renderLog(lines) {
  statusBox.textContent = lines.join('\n');
  statusBox.classList.add('visible');
  statusBox.scrollTop = statusBox.scrollHeight;
}

function showBanner(kind, text) {
  resultBanner.textContent = text;
  resultBanner.className = `banner visible ${kind}`;
}

function showRunning(op) {
  runningOpLabel.textContent = `Running: ${opLabels[op]}…`;
  runningIndicator.classList.add('visible');
}

function hideRunning() {
  runningIndicator.classList.remove('visible');
}

// Reload the rater panel so freshly-scraped games appear.
function reloadRater() {
  try {
    raterFrame.contentWindow.location.reload();
  } catch (e) {
    raterFrame.src = 'gamelog.html?t=' + Date.now();
  }
}

async function pollStatus() {
  let status;
  try {
    status = await api().get_status();
  } catch (e) {
    clearInterval(pollHandle);
    pollHandle = null;
    hideRunning();
    setButtonsEnabled(true);
    showBanner('error', `Lost connection to the app: ${e}`);
    return;
  }
  renderLog(status.log);
  if (status.done) {
    clearInterval(pollHandle);
    pollHandle = null;
    hideRunning();
    setButtonsEnabled(true);
    if (status.error) {
      showBanner('error', `Error: ${status.error}`);
    } else if (status.result) {
      const r = status.result;
      const added = r.added || 0;
      showBanner('success',
        `✓ Done — ${added} new game${added === 1 ? '' : 's'} added` +
        (r.covers_found != null ? `, ${r.covers_found} cover(s) ready` : '') + '.');
      reloadRater();
    } else {
      showBanner('success', '✓ Done.');
      reloadRater();
    }
  }
}

async function startOp(op) {
  resultBanner.className = 'banner';
  statusBox.classList.remove('visible');
  statusBox.textContent = '';
  setButtonsEnabled(false);
  showRunning(op);
  let result;
  try {
    result = await api()[startMethod[op]]();
  } catch (e) {
    hideRunning();
    setButtonsEnabled(true);
    showBanner('error', `Could not start: ${e}`);
    return;
  }
  if (!result.ok) {
    hideRunning();
    setButtonsEnabled(true);
    if (result.error === 'busy') {
      showBanner('error', 'An operation is already running.');
    } else {
      showBanner('error', `Could not start: ${result.error}`);
    }
    return;
  }
  pollHandle = setInterval(pollStatus, 700);
  pollStatus();
}

Object.entries(opButtons).forEach(([op, btn]) => {
  btn.addEventListener('click', () => startOp(op));
});

// Autosave the URL fields (debounced) as they're edited.
let urlsSaveTimer = null;
function scheduleSaveUrls() {
  if (urlsSaveTimer) clearTimeout(urlsSaveTimer);
  urlsSaveTimer = setTimeout(async () => {
    const folderUrl = document.getElementById('folder-url').value.trim();
    const masterUrl = document.getElementById('master-url').value.trim();
    const msg = document.getElementById('save-urls-msg');
    const result = await api().save_config(folderUrl, masterUrl);
    msg.textContent = result.ok ? 'Saved.' : `Error: ${result.error}`;
    setTimeout(() => { msg.textContent = ''; }, 2000);
  }, 600);
}
['folder-url', 'master-url'].forEach(id => {
  document.getElementById(id).addEventListener('input', scheduleSaveUrls);
});

document.getElementById('quit-btn').addEventListener('click', () => {
  if (api() && api().quit_app) api().quit_app();
});

// ── Export Image (current view → PNG in Downloads) ─────────────────────
const exportBtn = document.getElementById('export-btn');
const exportMsg = document.getElementById('export-msg');

function setExportMsg(text, isError) {
  exportMsg.textContent = text;
  exportMsg.classList.toggle('error', !!isError);
}

exportBtn.addEventListener('click', async () => {
  const bridge = raterBridge();
  if (!bridge || typeof bridge.exportImage !== 'function') {
    setExportMsg('Rater page not ready yet.', true);
    return;
  }
  const meta = bridge.getMeta();
  if (meta.currentView !== 'tier' && meta.currentView !== 'goty') {
    setExportMsg('Switch to Tier or GOTY view to export.', true);
    return;
  }

  exportBtn.disabled = true;
  setExportMsg('Rendering image…', false);
  try {
    const img = await bridge.exportImage();
    if (!img || !img.ok) {
      const reason = img && img.error === 'unsupported-view'
        ? 'Switch to Tier or GOTY view to export.'
        : `Could not create image${img && img.error ? `: ${img.error}` : ''}.`;
      setExportMsg(reason, true);
      return;
    }
    const saved = await api().export_image(img.dataUrl, img.view, img.year);
    if (saved && saved.ok) {
      setExportMsg(`Saved ${saved.name} to Downloads.`, false);
    } else {
      setExportMsg(`Could not save${saved && saved.error ? `: ${saved.error}` : ''}.`, true);
    }
  } catch (e) {
    setExportMsg(`Export failed: ${e}`, true);
  } finally {
    exportBtn.disabled = false;
  }
});

// Esc toggles fullscreen so the user is never trapped with no window controls.
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && api() && api().toggle_fullscreen) {
    api().toggle_fullscreen();
  }
});

// ── Rater controls (year list + view toggle drive the iframe) ──────────
function raterBridge() {
  try { return raterFrame.contentWindow.raterBridge || null; } catch (e) { return null; }
}

function syncRaterControls(meta) {
  if (!meta) return;
  document.querySelectorAll('.year-item').forEach(b =>
    b.classList.toggle('active', parseInt(b.dataset.year) === meta.currentYear));
  document.querySelectorAll('#view-toggle .view-btn').forEach(b => {
    const v = b.dataset.view;
    b.classList.toggle('active', v === meta.currentView);
    if (v === 'tier' || v === 'list') b.style.display = meta.restricted ? 'none' : '';
  });
}

function buildYearList(meta) {
  const container = document.getElementById('year-list');
  container.innerHTML = '';
  (meta.years || []).forEach(yr => {
    const btn = document.createElement('button');
    btn.className = 'year-item' + (yr === meta.currentYear ? ' active' : '');
    btn.textContent = String(yr);
    btn.dataset.year = yr;
    btn.addEventListener('click', () => {
      const b = raterBridge();
      if (b) syncRaterControls(b.setYear(yr));
    });
    container.appendChild(btn);
  });
}

function onRaterLoad() {
  const b = raterBridge();
  if (!b) return;
  const meta = b.getMeta();
  buildYearList(meta);
  syncRaterControls(meta);
}

document.querySelectorAll('#view-toggle .view-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const b = raterBridge();
    if (b) syncRaterControls(b.setView(btn.dataset.view));
  });
});

raterFrame.addEventListener('load', onRaterLoad);
onRaterLoad();  // in case the iframe already finished loading

async function init() {
  const config = await api().get_config();
  document.getElementById('folder-url').value = config.folder_url || '';
  document.getElementById('master-url').value = config.master_url || '';
  setButtonsEnabled(true);

  // Resume polling if an operation is still running in the background.
  const status = await api().get_status();
  if (status.running) {
    setButtonsEnabled(false);
    showRunning(status.op);
    pollHandle = setInterval(pollStatus, 700);
    pollStatus();
  }
}

if (window.pywebview && typeof window.pywebview.api.get_config === 'function') {
  init();
} else {
  window.addEventListener('pywebviewready', init);
}
</script>
</body>
</html>
